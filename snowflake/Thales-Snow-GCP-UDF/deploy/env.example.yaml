# Replace these placeholders. This contains no credentials.
# All ten UDF settings below are optional environment fallbacks when
# deploy/snowflake.sql supplies all ten headers, including CRDPIP and CRDPPORT.
CRDPIP: "REPLACE_WITH_REACHABLE_CRDP_HOST"
CRDPPORT: "8090"
mode: "protectbulk"
datatype: "char"
protection_profile: "REPLACE_WITH_CRDP_PROTECTION_POLICY_NAME"
keymetadatalocation: "internal"
# For revealbulk with external metadata, supply this header or environment value:
# keymetadata: "REPLACE_WITH_EXTERNAL_VERSION"
showrevealinternalkey: "yes"
returnciphertextforuserwithnokeyaccess: "no"
usersetlookup: "no"
BATCHSIZE: "1000"
